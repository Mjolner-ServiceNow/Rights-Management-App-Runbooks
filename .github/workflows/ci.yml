name: CI

# Runs on every pull request and every push to a non-main branch.
# Nothing here touches Azure, so it needs no credentials and no approval.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-analyzer-1.25.0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -ge '1.25.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery
          }

      - name: Check formatting
        shell: pwsh
        run: ./build/Invoke-Format.ps1 -Check

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./build/Invoke-Analysis.ps1 -FailOn Error, Warning -OutputSarif ./analysis.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./analysis.sarif
          category: psscriptanalyzer
        continue-on-error: true

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-pester-5.8.0-analyzer-1.25.0

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.8.0')) {
            Install-Module Pester -RequiredVersion 5.8.0 -Force -Scope CurrentUser -Repository PSGallery -SkipPublisherCheck
          }

      # tests/Unit/RmaRules.Tests.ps1 exercises the custom analyzer rules, so this job
      # needs the analyzer as well as Pester.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -ge '1.25.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery
          }

      - name: Run Pester
        shell: pwsh
        run: ./build/Invoke-Tests.ps1 -CI

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/TestResults.xml
            tests/Coverage.xml

      - name: Enforce coverage floor
        shell: pwsh
        run: ./build/Assert-Coverage.ps1 -Path ./tests/Coverage.xml -MinimumPercent 70
