name: CI

# Runs on every pull request and every push to a non-main branch.
# Nothing here touches Azure, so it needs no credentials and no approval.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-analyzer-1.25.0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -ge '1.25.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery
          }

      - name: Check formatting
        shell: pwsh
        run: ./build/Invoke-Format.ps1 -Check

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./build/Invoke-Analysis.ps1 -FailOn Error, Warning -OutputSarif ./analysis.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./analysis.sarif
          category: psscriptanalyzer
        continue-on-error: true

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-pester-5.8.0

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.8.0')) {
            Install-Module Pester -RequiredVersion 5.8.0 -Force -Scope CurrentUser -Repository PSGallery -SkipPublisherCheck
          }

      - name: Run Pester
        shell: pwsh
        run: ./build/Invoke-Tests.ps1 -CI

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/TestResults.xml
            tests/Coverage.xml

      - name: Enforce coverage floor
        shell: pwsh
        run: ./build/Assert-Coverage.ps1 -Path ./tests/Coverage.xml -MinimumPercent 70

  infra:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build (fails on any lint warning)
        run: |
          set -euo pipefail
          # --stdout to /dev/null: we only care about diagnostics on stderr.
          # Both are supported entry points; workload.bicep is deployed directly when
          # subscription Contributor is unavailable.
          : > bicep-diagnostics.txt
          if az bicep build --file infra/main.bicep     --stdout 2>> bicep-diagnostics.txt > /dev/null &&
             az bicep build --file infra/workload.bicep --stdout 2>> bicep-diagnostics.txt > /dev/null; then
            if [ -s bicep-diagnostics.txt ]; then
              echo "::error::Bicep produced diagnostics; treat warnings as errors."
              cat bicep-diagnostics.txt
              exit 1
            fi
            echo "Bicep compiled with no diagnostics."
          else
            cat bicep-diagnostics.txt
            exit 1
          fi

      - name: Parameter files must not contain real values
        shell: pwsh
        run: |
          # This repository is public. The committed parameter files are templates and
          # must keep their placeholders. A filled-in file would publish the customer's
          # subscription id, resource group, VM name and subnet.
          $failed = $false
          foreach ($file in Get-ChildItem infra/*.parameters.*.json) {
            $raw = Get-Content $file -Raw

            # A subscription-scoped resource id, or a bare subscription GUID.
            if ($raw -match '/subscriptions/[0-9a-fA-F-]{36}/') {
              Write-Host "::error file=$($file.Name)::Contains a real Azure resource id. Keep placeholders here and put real values in a .local.json, which is gitignored."
              $failed = $true
            }

            $content = $raw | ConvertFrom-Json
            foreach ($required in 'hybridWorkerVmResourceId') {
              $value = $content.parameters.$required.value
              if ($value -and $value -notlike 'REPLACE_WITH_*') {
                Write-Host "::error file=$($file.Name)::Parameter '$required' has a real value. It must stay as a REPLACE_WITH_ placeholder."
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Parameter templates contain no real values."
