name: Release

# Packages RMA.Runbooks and attaches it to a GitHub release, so Hybrid Workers can be
# provisioned from a versioned URL with no credentials. Touches nothing outside this
# repository and uses no secrets beyond the automatic GITHUB_TOKEN.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the module version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $manifest = (Import-PowerShellDataFile ./src/RMA.Runbooks/RMA.Runbooks.psd1).ModuleVersion
          if ($tag -and $tag -ne $manifest) {
            # A release whose asset version disagrees with its tag is how a worker ends up
            # running a module the runbooks are not pinned to.
            throw "Tag v$tag does not match ModuleVersion $manifest."
          }
          Write-Host "Tag and manifest agree on $manifest"

      - id: package
        name: Package module
        shell: pwsh
        run: ./build/New-RmaModulePackage.ps1 -OutputDirectory ./out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./out/RMA.Runbooks-*.zip
          generate_release_notes: true
          body: |
            ## Installing on a Hybrid Runbook Worker

            Azure Automation cannot deliver this module to a Hybrid Worker. Modules imported
            into an Automation Account serve Azure sandbox jobs only; a worker resolves
            modules from its own `PSModulePath`.

            On each worker, elevated:

            ```powershell
            ./scripts/Initialize-RmaWorker.ps1 `
                -ModuleSource 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/RMA.Runbooks-${{ steps.package.outputs.version }}.zip'
            ```

            SHA256: `${{ steps.package.outputs.sha256 }}`

            The version installed must match the `RequiredVersion` in each runbook's
            `#Requires`. A mismatch fails the job at parse time, which is intended.
